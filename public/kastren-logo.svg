<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <linearGradient id="kl-pillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kl-upper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="kl-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="kl-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark (K-Ascent) -->
  <g transform="translate(40, 20) scale(0.666)">
    <!-- 1. The Stability Pillar -->
    <rect x="0" y="0" width="68" height="300" rx="34" fill="url(#kl-pillar)"/>

    <!-- 2. The Ascending Trend Wing -->
    <path d="M 68 150 L 176 34 C 188 20 208 20 220 32 L 230 42 C 242 54 242 74 228 86 L 126 182 Z" fill="url(#kl-upper)"/>
    <circle cx="218" cy="48" r="8" fill="#6ee7b7"/>

    <!-- 3. The Grounding Anchor Leg -->
    <path d="M 104 154 L 218 262 C 230 274 230 294 218 306 L 208 316 C 196 328 176 328 164 316 L 68 214 Z" fill="url(#kl-lower)"/>

    <!-- 4. The Vault Vertex -->
    <polygon points="68,150 114,110 148,150 102,190" fill="#34d399" opacity="0.95"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(260, 138)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="88"
          font-weight="900"
          letter-spacing="5"
          fill="#0c1410">KASTREN</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(264, 184)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="20"
          font-weight="700"
          letter-spacing="7"
          fill="#059669">MONEY, IN BALANCE.</text>
  </g>
</svg>
